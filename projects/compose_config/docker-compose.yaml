services:
  sample-web:
    build:
      context: ./build
      dockerfile: Dockerfile
      args:
        NGINX_WEBROOT: ${NGINX_WEBROOT:-/var/www/html}
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      NGINX_WEBROOT: ${NGINX_WEBROOT:-/var/www/html}
      NGINX_HOST: ${NGINX_WEBROOT:-localhost}
    ports:
    - "8080:${NGINX_PORT:-80}"